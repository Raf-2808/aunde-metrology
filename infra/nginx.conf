worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Token publiczny nie może trafić do logów ścieżek.
  access_log off;
  error_log /var/log/nginx/error.log crit;
  limit_req_zone $binary_remote_addr zone=qr:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /api/logowanie {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
    }
    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_read_timeout 180s;
      add_header Cache-Control no-store always;
    }
    location /public/ { return 404; }
    location /p/ { return 404; }
    location / { try_files $uri /index.html; }
  }
  server {
    listen 8081;
    root /usr/share/nginx/html;
    add_header Cache-Control no-store always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'none'; base-uri 'self'" always;
    location /public/ {
      limit_req zone=qr burst=30 nodelay;
      proxy_pass http://publiczne:8001;
      proxy_set_header Host $host;
    }
    location /api/ { return 404; }
    location /p/ { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; }
    location = /robots.txt { return 200 'User-agent: *\nDisallow: /'; }
    location / { return 404; }
  }
}
