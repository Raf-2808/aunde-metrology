name: LIMS validation
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lims_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: lims_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lims_test" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: alembic upgrade head && pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://lims_test:test_only_password@localhost:5432/lims_test
          TEST_DATABASE_URL: postgresql+psycopg://lims_test:test_only_password@localhost:5432/lims_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated Compose environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_only_isolated_database/' .env
          sed -i 's|^PUBLIC_URL=.*|PUBLIC_URL=https://localhost|' .env
          sed -i 's/^SITE_ADDRESS=.*/SITE_ADDRESS=localhost/' .env
          docker compose config --quiet
      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify HTTPS, API and backup
        run: |
          docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt ./ci-root.crt
          curl --fail --cacert ./ci-root.crt https://localhost/api/health
          curl --fail --cacert ./ci-root.crt https://localhost/
          docker compose exec -T backup sh -c 'ls /backups/*.dump'
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down isolated services
        if: always()
        run: docker compose down -v
